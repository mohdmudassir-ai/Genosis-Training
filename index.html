<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Hub</title>
    <meta name="description" content="A simple, sleek student management system.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="container">
        <header>
            <h1>Student Management</h1>
            <p>Presented by Lokesh kale.</p>
        </header>

        <div class="dashboard-grid">
            <!-- Form Section -->
            <section class="glass-panel form-section">
                <h2 id="form-title">Add New Student</h2>
                <form id="student-form">
                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required placeholder="e.g. John Doe">
                    </div>
                    
                    <div class="input-group">
                        <label for="course">Course</label>
                        <input type="text" id="course" name="course" required placeholder="e.g. Computer Science">
                    </div>

                    <div class="input-group">
                        <label for="marks">Marks</label>
                        <input type="number" id="marks" name="marks" required placeholder="e.g. 95">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submit-btn">Add Student</button>
                        <button type="button" class="btn btn-secondary hidden" id="cancel-btn">Cancel Edit</button>
                    </div>
                </form>
            </section>

            <!-- Data List Section -->
            <section class="glass-panel list-section">
                <h2>Student Directory</h2>
                <div class="table-container">
                    <table id="students-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Course</th>
                                <th>Marks</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-tbody">
                            <!-- Data will be populated here -->
                            <tr>
                                <td colspan="4" class="text-center loading-text">Loading students...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">
        <p id="toast-message">Notification</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
